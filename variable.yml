- name: Declaring Variable at play level
  hosts: all
  become: yes
  vars:
    URL: play.example.com
  tasks:
    - name: Access a variable
      ansible.builtin.debug:
        msg: URL == {{URL}}

    - name: Declare variable at task level
      vars:
        URL: task.example.com
      ansible.builtin.debug:
        msg: URL == {{URL}}


- name: Declare variable at task level
  hosts: all
  become: yes
  tasks:
    - name: Declare variable at task level
      vars:
        URL: task1.example.com
      ansible.builtin.debug:
        msg: URL is {{URL}}


- name: Declare variable at file level
  hosts: all
  become: yes
  var_files:
    - var.yml
  tasks:
    - name: Declare variable at file level
      ansible.builtin.debug:
        msg: URL is {{URL}}

